<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타이밍 야구 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--ink:#0B1A2B;--deep:#07101C;--chalk:#F2F2EC;--lamp:#F2B632;--dim:#8DA0B8;--line:#24384F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--chalk);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{min-height:100vh;display:flex;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
main{width:100%;max-width:960px;padding:12px 0}
h1{font:400 28px/1.1 'Black Han Sans','Noto Sans KR',sans-serif;margin:4px 0 12px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
@media(min-width:640px){#board{grid-template-columns:repeat(6,1fr)}}
#board>div{background:var(--deep);padding:8px 10px;font-size:13px;color:var(--dim)}
#board b{display:block;margin-top:2px;color:var(--lamp);font:400 22px/1.2 'Black Han Sans','Noto Sans KR',sans-serif}
#board b.dots{font-size:18px;letter-spacing:3px}
#stage{position:relative;border-radius:8px;overflow:hidden;background:var(--deep);aspect-ratio:16/10;touch-action:none;cursor:pointer}
@media(max-aspect-ratio:1/1){#stage{aspect-ratio:4/5}}
#stage canvas{display:block;width:100%;height:100%}
#dia{position:absolute;top:14px;right:14px;width:64px;height:52px;pointer-events:none}
.bs{position:absolute;width:16px;height:16px;transform:rotate(45deg);border:2px solid rgba(242,242,236,.6);background:rgba(242,242,236,.12)}
.bs.on{background:var(--lamp);border-color:var(--lamp)}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#msg b{display:block;font:400 clamp(36px,7vw,64px)/1 'Black Han Sans','Noto Sans KR',sans-serif;color:var(--lamp);text-shadow:0 2px 6px rgba(0,0,0,.7)}
#msg span{display:block;margin-top:8px;font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#msg.on{animation:pop 1.3s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#msg.on{animation:fade 1.3s linear}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(7,16,28,.88)}
#ov[hidden]{display:none}
#ov h2{margin:0;font:400 40px/1.1 'Black Han Sans','Noto Sans KR',sans-serif}
#ov p{margin:0;white-space:pre-line;line-height:1.6}
button{background:var(--lamp);color:var(--ink);border:0;border-radius:6px;padding:12px 28px;font:700 16px 'Noto Sans KR',sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
#types{display:flex;gap:8px;margin-top:10px}#types[hidden]{display:none}
#types button{flex:1;background:var(--deep);color:var(--chalk);border:1px solid var(--line);padding:10px 6px;font-size:14px}
#types button.on{background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
#ov .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.help{margin:10px 2px 0;font-size:13px;line-height:1.6;color:var(--dim)}
</style>
</head>
<body>
<main>
  <h1>타이밍 야구 3D</h1>
  <div id="board">
    <div>이닝<b id="inn">1회 초</b></div>
    <div>나 : 상대<b id="score">0 : 0</b></div>
    <div>최고 득실차<b id="best">0</b></div>
    <div>볼<b id="b" class="dots">○○○</b></div>
    <div>스트라이크<b id="s" class="dots">○○</b></div>
    <div>아웃<b id="o" class="dots">○○</b></div>
  </div>
  <div id="stage">
    <div id="dia"><i class="bs" style="left:24px;top:4px"></i><i class="bs" style="left:46px;top:26px"></i><i class="bs" style="left:2px;top:26px"></i></div>
    <div id="msg" aria-live="polite"></div>
    <div id="ov">
      <h2 id="ovT">타이밍 야구 3D</h2>
      <p id="ovP">3이닝, 초와 말마다 공격(타자)과 수비(투수)를 번갈아 합니다.
3아웃이 되면 공수 교대. 주자는 베이스를 달려 진루하고, 수비 AI가 송구로 아웃을 잡습니다.</p>
      <div class="row"><button id="go">공격부터 시작</button><button id="go2">수비부터 시작</button></div>
    </div>
  </div>
  <div id="types" hidden><button class="on" data-i="0">직구 (1)</button><button data-i="1">커브 (2)</button><button data-i="2">체인지업 (3)</button></div>
  <p class="help">타자 모드: 스페이스바 또는 터치로 스윙. 투수 모드: 마우스나 터치로 코스를 정해 클릭하면 투구, 1~3 키로 구종 선택, 방향키로 미세 조정. 3아웃마다 공수가 바뀝니다. 수비수는 AI가 판단해 공을 쫓고 송구하며, 병살과 희생플라이도 나옵니다.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));
if(!window.THREE){$('ovP').textContent='3D 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인한 뒤 새로고침하세요.';$('go').hidden=$('go2').hidden=true;return}
const MAX_INN=3,CONTACT=64,V3=(x,y,z)=>new THREE.Vector3(x,y,z);
let best=null;
const S={phase:'idle',mode:'bat',pt:0,fm:'bat',h:0,sc:[0,0],outs:0,balls:0,strikes:0,hits:0,hr:0,bases:[0,0,0]};
Object.defineProperty(S,'score',{get(){return S.sc[S.mode==='bat'?0:1]},set(v){S.sc[S.mode==='bat'?0:1]=v}});
const hm=()=>S.fm==='bat'?1:0;
let P=null,sw=null,hit=null,timer=0,ac=null,last=performance.now();

/* ---------- 장면 ---------- */
const stage=$('stage'),ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;stage.prepend(ren.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101c);scene.fog=new THREE.Fog(0x07101c,80,320);
const cam=new THREE.PerspectiveCamera(52,1,.3,600),camPos=V3(.7,2,5.4),DEF=V3(0,1.1,-9),look=DEF.clone(),lookT=DEF.clone();
cam.position.copy(camPos);
function rs(){const w=stage.clientWidth,h=stage.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);new ResizeObserver(rs).observe(stage);rs();

scene.add(new THREE.HemisphereLight(0xbcd0ff,0x14301f,.65));
const sun=new THREE.DirectionalLight(0xfff0d0,1.1);sun.position.set(14,30,16);sun.target.position.set(0,0,-8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:5,far:80});
scene.add(sun,sun.target);

function tex(w,h,fn,rep){const k=document.createElement('canvas');k.width=w;k.height=h;fn(k.getContext('2d'),w,h);const t=new THREE.CanvasTexture(k);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
const mat=(c,r)=>new THREE.MeshStandardMaterial({color:c,roughness:r==null?.85:r});
function mk(geo,m,x,y,z,p,sh){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=sh!==false;p.add(o);return o}
function flat(geo,m,x,y,z,rz){const o=new THREE.Mesh(geo,m);o.rotation.x=-Math.PI/2;o.rotation.z=rz||0;o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o}

const grass=tex(256,256,(g,w,h)=>{g.fillStyle='#2b6e45';g.fillRect(0,0,w,h);g.fillStyle='#307a4c';g.fillRect(0,0,w,h/2);
  for(let i=0;i<2500;i++){g.fillStyle='rgba(0,0,0,'+R(.02,.07)+')';g.fillRect(R(0,w),R(0,h),2,2)}},[34,34]);
flat(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({map:grass,roughness:1}),0,0,-100);
const dirt=mat(0x8a5a3b,1);
flat(new THREE.PlaneGeometry(33,33),dirt,0,.02,-19.4,Math.PI/4);
flat(new THREE.PlaneGeometry(21,21),new THREE.MeshStandardMaterial({map:grass,roughness:1}),0,.03,-19.4,Math.PI/4);
flat(new THREE.CircleGeometry(7.5,40),dirt,0,.04,0);
const mound=mk(new THREE.CylinderGeometry(2.7,3.3,.28,32),dirt,0,.14,-18.4,scene,false);mound.receiveShadow=true;
mk(new THREE.BoxGeometry(.6,.05,.15),mat(0xffffff),0,.3,-18.4,scene,false);
const chalk=new THREE.MeshBasicMaterial({color:0xf2f2ec});
[[1,Math.PI/4],[-1,3*Math.PI/4]].forEach(([s,a])=>{const l=mk(new THREE.BoxGeometry(110,.02,.15),chalk,s*38.9,.05,-38.9,scene,false);l.rotation.y=a});
[[19.4,-19.4],[0,-38.8],[-19.4,-19.4]].forEach(([x,z])=>{const b=mk(new THREE.BoxGeometry(.55,.12,.55),mat(0xffffff),x,.08,z,scene,false);b.rotation.y=Math.PI/4});
const ps=new THREE.Shape();[[-.24,0],[.24,0],[.24,-.24],[0,-.48],[-.24,-.24]].forEach(([x,y],i)=>i?ps.lineTo(x,y):ps.moveTo(x,y));
const plate=new THREE.Mesh(new THREE.ExtrudeGeometry(ps,{depth:.04,bevelEnabled:false}),mat(0xffffff));
plate.rotation.x=-Math.PI/2;plate.position.set(0,.05,-.1);scene.add(plate);
const zone=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([V3(-.22,.56,.1),V3(.22,.56,.1),V3(.22,1.08,.1),V3(-.22,1.08,.1)]),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));
scene.add(zone);

/* 외야 펜스, 관중석, 조명탑, 별 */
const TS=Math.PI-1.05,TL=2.1;
const wall=new THREE.Mesh(new THREE.CylinderGeometry(100,100,4,72,1,true,TS,TL),new THREE.MeshStandardMaterial({color:0x14402e,roughness:.8,side:THREE.DoubleSide}));
wall.position.y=2;scene.add(wall);
const rim=new THREE.Mesh(new THREE.CylinderGeometry(100,100,.3,72,1,true,TS,TL),new THREE.MeshBasicMaterial({color:0xf2b632,side:THREE.DoubleSide}));
rim.position.y=4;scene.add(rim);
const crowd=tex(256,64,(g,w,h)=>{g.fillStyle='#161b2a';g.fillRect(0,0,w,h);const pal=['#d9534f','#f0ad4e','#5bc0de','#eeeeee','#6c8ebf'];
  for(let i=0;i<1100;i++){g.fillStyle=pal[i%5];g.fillRect(R(0,w),R(0,h),3,3)}},[28,1]);
const stands=new THREE.Mesh(new THREE.CylinderGeometry(126,101,24,72,1,true,TS,TL),new THREE.MeshBasicMaterial({map:crowd,color:0x9aa3bd,side:THREE.DoubleSide}));
stands.position.y=15.5;scene.add(stands);
const glow=tex(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,246,216,1)');r.addColorStop(1,'rgba(255,246,216,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
[[-95,-85],[95,-85],[-45,-128],[45,-128]].forEach(([x,z])=>{
  mk(new THREE.CylinderGeometry(.6,.9,42,8),mat(0x444b57),x,21,z,scene,false);
  const p=mk(new THREE.BoxGeometry(13,7,1),new THREE.MeshBasicMaterial({color:0xfff6d8,fog:false}),x,44,z,scene,false);p.lookAt(0,20,0);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));s.scale.set(70,70,1);s.position.set(x,44,z);scene.add(s);
});
{const pts=[];for(let i=0;i<500;i++){const a=R(0,6.28),b=R(.15,1.2);pts.push(Math.cos(a)*Math.cos(b)*450,Math.sin(b)*450,Math.sin(a)*Math.cos(b)*450)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.5,sizeAttenuation:false,color:0xffffff,fog:false})))}

/* ---------- 선수 ---------- */
function figure(shirt,cap,x,z){
  const g=new THREE.Group(),m1=mat(shirt);
  mk(new THREE.CylinderGeometry(.09,.08,.85,8),mat(0xdddddd),-.1,.43,0,g);
  mk(new THREE.CylinderGeometry(.09,.08,.85,8),mat(0xdddddd),.1,.43,0,g);
  mk(new THREE.CylinderGeometry(.2,.17,.62,10),m1,0,1.15,0,g);
  mk(new THREE.SphereGeometry(.13,12,10),mat(0xe8c9a0),0,1.6,0,g);
  mk(new THREE.SphereGeometry(.14,12,8,0,Math.PI*2,0,Math.PI/2),mat(cap),0,1.62,0,g);
  g.position.set(x,0,z);scene.add(g);return g;
}
const SPDF=7,B1=V3(19.4,0,-19.4),B1T=V3(19.4,1.2,-19.4),MT=V3(0,1.2,-18.4),B2T=V3(0,1.2,-38.8),B2P=V3(0,0,-38.8);
const F=[[17,-20],[7,-31],[-7,-31],[-17,-20],[-40,-62],[0,-76],[40,-62]].map(([x,z])=>{const g=figure(0xcfd6e0,0xb02020,x,z);g.rotation.y=Math.atan2(-x,5-z);return{g,home:V3(x,0,z)}});
function resetField(){F.forEach(f=>{f.g.position.copy(f.home);f.g.rotation.y=Math.atan2(-f.home.x,5-f.home.z)})}
const BP=[V3(0,0,.6),V3(19.4,0,-19.4),V3(0,0,-38.8),V3(-19.4,0,-19.4),V3(0,0,.6)];
const pool=[...Array(8)].map(()=>{const g=figure(0xf2b632,0x7a5b00,0,0);g.visible=false;return{g,on:false,b:0,to:0,t0:0,sp:16,out:false,h:0}});
let occ=[null,null,null,null];
const pit=figure(0xffffff,0x1b2a5c,0,-18.4);pit.position.y=.28;pit.rotation.y=Math.PI;
const arm=new THREE.Group();arm.position.set(.24,2,-18.4);scene.add(arm);
mk(new THREE.CylinderGeometry(.05,.045,.62,8),mat(0xffffff),0,-.31,0,arm);

const bt=new THREE.Group();scene.add(bt);
[-.1,.1].forEach(dx=>mk(new THREE.CylinderGeometry(.09,.08,.85,8),mat(0x1b2a5c),-.95+dx,.43,.1,bt));
const up=new THREE.Group();up.position.set(-.95,.85,.1);bt.add(up);
mk(new THREE.CylinderGeometry(.2,.17,.62,10),mat(0xf0f0f0),0,.3,0,up);
mk(new THREE.SphereGeometry(.13,12,10),mat(0xe8c9a0),0,.77,0,up);
mk(new THREE.SphereGeometry(.15,12,8,0,Math.PI*2,0,Math.PI/2),mat(0x1b2a5c),0,.79,0,up);
[-.06,.06].forEach(dz=>{const a=mk(new THREE.CylinderGeometry(.045,.04,.42,8),mat(0xf0f0f0),.22,.375,dz,up);a.rotation.z=-2.54});
const bat=new THREE.Group();bat.position.set(.34,.2,0);bat.rotation.z=-Math.PI/2-.14;up.add(bat);
mk(new THREE.CylinderGeometry(.05,.02,1,10),mat(0xc99a5b,.6),0,.5,0,bat);

/* 공 */
const seam=tex(128,64,(g,w,h)=>{g.fillStyle='#f4f4ee';g.fillRect(0,0,w,h);g.strokeStyle='#c0392b';g.lineWidth=3;
  [32,96].forEach(x=>{g.beginPath();g.arc(x+(x<64?-26:26),32,28,x<64?-.9:Math.PI-.9,x<64?.9:Math.PI+.9);g.stroke()})});
const ball=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),new THREE.MeshStandardMaterial({map:seam,roughness:.6}));
ball.castShadow=true;ball.visible=false;scene.add(ball);
const shd=new THREE.Mesh(new THREE.CircleGeometry(.14,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.45,depthWrite:false}));
shd.rotation.x=-Math.PI/2;shd.visible=false;scene.add(shd);

/* ---------- 투구 조작, 수비 AI ---------- */
const TYPES=[{dur:[560,660],c:0,l:.05,err:.05,bias:0},{dur:[900,1000],c:.9,l:.35,err:.09,bias:25},{dur:[960,1080],c:0,l:.1,err:.07,bias:-95}];
const ret=new THREE.Mesh(new THREE.TorusGeometry(.06,.008,8,24),new THREE.MeshBasicMaterial({color:0xf2b632,fog:false}));ret.visible=false;scene.add(ret);
const rc=new THREE.Raycaster(),pln=new THREE.Plane(V3(0,0,1),-.1),mv=new THREE.Vector2(),aim=V3(0,.82,.15);
function aimAt(e){const r=stage.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(mv,cam);
  const h=V3(0,0,0);if(rc.ray.intersectPlane(pln,h)){aim.x=C(h.x,-.5,.5);aim.y=C(h.y,.3,1.4)}}
const bk=()=>'bb3d-bestg';
function loadBest(){let v=null;try{v=localStorage.getItem(bk())}catch(e){}best=v===null?null:+v}
function setPT(i){S.pt=i;document.querySelectorAll('#types button').forEach((b,j)=>b.classList.toggle('on',j===i))}
function sim(p0,v0,dur){const a=[],p=p0.clone(),v=v0.clone();
  for(let i=0;i<dur*60;i++){v.y-=14/60;p.addScaledVector(v,1/60);if(p.y<.13){p.y=.13;if(v.y<0){v.y*=-.35;if(v.y<1.5)v.y=0}}
    if(p.y<=.14){v.x*=1-1.3/60;v.z*=1-1.3/60}a.push(p.clone())}
  return a}
function defend(path){
  for(let i=18;i<Math.min(path.length,150);i+=3){const b=path[i];if(b.y>2.6)continue;
    for(const f of F){const q=f.g.position;if(Math.hypot(q.x-b.x,q.z-b.z)/SPDF+.3<=i/60)return{i,f,air:b.y>.5}}}
  return null}

/* ---------- 소리 ---------- */
function snd(f,d,t,v,f2){if(!ac)return;const T=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,T);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(T+d)}

/* ---------- 상태와 규칙 ---------- */
const dots=(n,m)=>'●'.repeat(n)+'○'.repeat(m-n);
function board(){
  $('inn').textContent=(Math.min(S.h>>1,MAX_INN-1)+1)+'회 '+(S.h%2?'말':'초')+(S.mode==='bat'?' 공격':' 수비');$('score').textContent=S.sc[0]+' : '+S.sc[1];$('best').textContent=best==null?'-':(best>0?'+':'')+best;
  $('b').textContent=dots(S.balls,3);$('s').textContent=dots(S.strikes,2);$('o').textContent=dots(S.outs,2);
  document.querySelectorAll('.bs').forEach((e,i)=>e.classList.toggle('on',!!S.bases[[1,0,2][i]]));
}
function flash(t,sub){
  const m=$('msg');m.innerHTML='';const a=document.createElement('b'),s=document.createElement('span');
  a.textContent=t;s.textContent=sub||'';m.append(a,s);m.classList.remove('on');void m.offsetWidth;m.classList.add('on');
}
function overlay(t,p,b){$('ovT').textContent=t;$('ovP').textContent=p;$('ov').hidden=false;$('go').focus({preventScroll:true})}
function newRunner(t0,sp){const q=pool.find(x=>!x.on)||pool[0];Object.assign(q,{on:true,b:0,to:0,out:false,h:0,t0,sp});q.g.visible=true;q.g.position.copy(BP[0]);return q}
function setOcc(no){occ=no;S.bases=[no[1]?1:0,no[2]?1:0,no[3]?1:0]}
function clearRun(){pool.forEach(q=>{q.on=false;q.g.visible=false});setOcc([null,null,null,null])}
function advance(n,ex,t0){
  const no=[null,null,null,null],sp=n>=4?28:16;
  for(let i=3;i>=1;i--){const r=occ[i];if(!r)continue;const t=Math.min(4,i+n+ex);r.to=t;r.t0=t0;r.sp=sp;if(t>=4)S.score++;else no[t]=r}
  const b=newRunner(t0,sp);b.to=Math.min(n,4);if(n>=4)S.score++;else no[n]=b;
  setOcc(no);S.balls=S.strikes=0;if(S.mode==='bat')S.hits++;
}
function walk(t0){
  const r=occ,no=[null,null,null,null],mv=(x,to)=>{x.to=to;x.t0=t0;x.sp=16};
  if(r[1]){if(r[2]){if(r[3]){mv(r[3],4);S.score++}mv(r[2],3);no[3]=r[2]}else no[3]=r[3];mv(r[1],2);no[2]=r[1]}else{no[2]=r[2];no[3]=r[3]}
  const b=newRunner(t0,16);b.to=1;no[1]=b;setOcc(no);S.balls=S.strikes=0;
}
function groundForce(dp,last,t0){
  const r=occ,no=[null,null,null,null],mv=(x,to)=>{x.to=to;x.t0=t0;x.sp=16};
  if(r[1]){
    if(r[2]){if(r[3]){mv(r[3],4);if(!last)S.score++}mv(r[2],3);no[3]=r[2]}else no[3]=r[3];
    mv(r[1],2);if(dp)r[1].out=true;else no[2]=r[1];
  }else{no[2]=r[2];no[3]=r[3]}
  const b=newRunner(t0,16);b.to=1;b.out=true;setOcc(no);
}
function changeSide(){
  S.outs=0;clearRun();S.h++;S.mode=S.mode==='bat'?'pitch':'bat';
  if(S.h===2*MAX_INN-1&&S.sc[hm()]>S.sc[1-hm()])S.h=2*MAX_INN;
  $('types').hidden=S.mode!=='pitch'||S.h>=2*MAX_INN;
}
function addOut(n){S.outs+=n;S.balls=S.strikes=0;if(S.outs>=3)changeSide()}

/* ---------- 투구 ---------- */
const REL=V3(.24,1.92,-17.8),WIND=550;
function pitch(){
  resetField();const now=performance.now(),inZone=Math.random()<.6;
  let tx=R(-.5,.5),ty=R(-.5,.5);
  if(!inZone){if(Math.random()<.6)tx=(Math.random()<.5?-1:1)*R(.75,1.1);else ty=(Math.random()<.5?-1:1)*R(.75,1.1)}
  const dur=R(640,1000)*(1-(S.h>>1)*.07);
  P={tx,ty,inZone,curve:Math.random()<.35?R(-1,1):0,lift:R(0,.35),t0:now+WIND,dur,done:false};
  P.arrive=P.t0+dur;S.phase='pitch';sw=null;hit=null;
}
function bp(p,o){
  const e=Math.min(p,1.2),a=Math.sin(Math.min(p,1)*Math.PI);
  return o.set(REL.x+(P.tx*.4-REL.x)*e+P.curve*a*.5,REL.y+(.82+P.ty*.5-REL.y)*e+P.lift*a,REL.z+(.1-REL.z)*e);
}

function ready(){resetField();P=null;hit=null;sw=null;S.phase='aim';flash('투구 준비')}
function throwPitch(){
  const T=TYPES[S.pt],e=T.err,tx=C((aim.x+R(-e,e))/.4,-1.3,1.3),ty=C((aim.y+R(-e,e)-.82)/.5,-1.3,1.3),now=performance.now();
  const me={tx,ty,inZone:Math.abs(tx)<.55&&Math.abs(ty)<.52,curve:T.c*(Math.random()<.5?-1:1),lift:T.l,t0:now+WIND,dur:R(T.dur[0],T.dur[1]),done:false};
  me.arrive=me.t0+me.dur;P=me;S.phase='pitch';sw=null;hit=null;
  const sp=S.strikes===2;
  if(Math.random()<(me.inZone?(sp?.95:.75):(sp?.4:.2))){
    const off=T.bias+170*(1+Math.max(Math.abs(tx),Math.abs(ty))*.8)*(R(-1,1)+R(-1,1)+R(-1,1))/1.5;
    setTimeout(()=>{if(P!==me||S.phase!=='pitch')return;sw={t:performance.now()};resolve(off)},me.arrive-CONTACT+off-now);
  }
}

/* ---------- 판정 ---------- */
const LABEL={hr:'홈런!',double:'2루타',single:'안타',groundout:'땅볼 아웃',flyout:'뜬공 아웃',foul:'파울',whiff:'헛스윙',strike:'스트라이크',ball:'볼'};
const SPD={hr:[36,24],double:[27,11],single:[21,5.5],groundout:[19,.4],flyout:[17,16],foul:[20,12]};
function resolve(off){
  P.done=true;S.phase='result';
  let r,parts=[];
  if(off===null){r=P.inZone?'strike':'ball';snd(220,.08,'triangle',.3,90)}
  else{
    const q=Math.abs(off)+(P.inZone?0:70);
    r=off<-280?'whiff':q<30?'hr':q<62?'double':q<100?'single':q<145?(Math.random()<.5?'groundout':'flyout'):q<210?'foul':'whiff';
    parts.push(Math.abs(off)<30?'타이밍 완벽':off<0?'너무 빨라요':'너무 늦어요');
    if(r==='whiff')snd(420,.14,'sine',.08,140);else setTimeout(()=>snd(900,.09,'square',.22,120),CONTACT);
  }
  if(SPD[r]){
    const T=performance.now()+CONTACT,d=C(off/110,-1,1),ang=r==='foul'?(d<0?-1:1)*R(.95,1.3):C(d,-.7,.7)*.85,[vh,vy]=SPD[r],s=vh*R(.9,1.1);
    const path=sim(bp(C((T-P.t0)/P.dur,0,1),V3(0,0,0)),V3(Math.sin(ang)*s,vy*R(.9,1.1),-Math.cos(ang)*s),r==='hr'?3.2:1.6);
    hit={t:T,path,plan:null,hr:r==='hr',chase:null};
    if(r!=='hr'&&r!=='foul'){
      const dd=defend(path);
      if(dd){
        const b=path[dd.i];
        if(dd.air)r='flyout';
        else if(dd.i/60+Math.hypot(b.x-19.4,b.z+19.4)/28+.25<4)r='groundout';
        else if(r==='groundout'||r==='flyout')r='single';
        hit.plan={f:dd.f,i:dd.i,air:dd.air,out:r==='groundout'};
      }else if(r==='groundout'||r==='flyout')r='single';
    }
    if(!hit.plan&&r!=='hr'){const e=path[path.length-1];hit.chase=F.reduce((a,f)=>Math.hypot(f.home.x-e.x,f.home.z-e.z)<Math.hypot(a.home.x-e.x,a.home.z-e.z)?f:a)}
  }
  const h0=S.h,sc0=S.sc[0]+S.sc[1],tt=hit?hit.t:performance.now(),ex=hit&&!hit.plan?1:0;let label=LABEL[r],dp=false;
  if(r==='hr'){if(S.mode==='bat')S.hr++;advance(4,0,tt)}
  else if(r==='double')advance(2,ex,tt);
  else if(r==='single')advance(1,ex,tt);
  else if(r==='groundout'){
    dp=!!(occ[1]&&S.outs<=1&&hit&&hit.plan&&!hit.plan.air&&hit.plan.i<75&&Math.random()<.7);
    groundForce(dp,S.outs+(dp?2:1)>=3,tt);
    if(dp)label='병살타';
    addOut(dp?2:1);
  }
  else if(r==='flyout'){
    const pre=S.outs,pl=hit&&hit.plan;
    addOut(1);
    if(pre<2&&occ[3]&&pl&&pl.air&&Math.hypot(hit.path[pl.i].x,hit.path[pl.i].z)>38){
      const sr=occ[3];sr.to=4;sr.t0=tt+pl.i*16.7+300;sr.sp=16;S.score++;occ[3]=null;setOcc(occ);label='희생플라이';
    }
  }
  else if(r==='foul'){if(S.strikes<2)S.strikes++}
  else if(r==='strike'||r==='whiff'){S.strikes++;if(S.strikes>=3){label='삼진 아웃';addOut(1)}}
  else if(r==='ball'){S.balls++;if(S.balls>=4){label='볼넷';walk(tt)}}
  if(hit&&hit.plan){const pl=hit.plan;pl.dp=dp;pl.seq=pl.air?[]:dp?[B2T,B1T]:pl.out?[B1T]:[MT]}
  const rn=S.sc[0]+S.sc[1]-sc0;if(rn>0)parts.push('+'+rn+'점');
  if(S.h!==h0)parts.push(S.h>=2*MAX_INN?'경기 종료':'3아웃, 공수 교대');
  if(S.h===2*MAX_INN-1&&S.sc[hm()]>S.sc[1-hm()]){S.h=2*MAX_INN;parts.push('끝내기')}
  flash(label,parts.join(', '));board();
  const n2=performance.now(),run=Math.max(0,...pool.filter(q=>q.on).map(q=>q.t0-n2+(q.to-q.b)*27400/q.sp));
  timer=setTimeout(()=>S.h>=2*MAX_INN?end():S.mode==='pitch'?ready():pitch(),Math.max(r==='hr'?3400:S.h!==h0?2600:1900,run+500));
}
function end(){
  S.phase='over';const d=S.sc[0]-S.sc[1],nb=best==null||d>best;
  if(nb){best=d;try{localStorage.setItem(bk(),best)}catch(e){}}
  board();$('types').hidden=true;
  overlay(d>0?'승리!':d<0?'패배':'무승부','나 '+S.sc[0]+' : '+S.sc[1]+' 상대\n안타 '+S.hits+'개, 홈런 '+S.hr+'개'+(nb&&d>0?'\n최고 득실차 기록!':''),'');
}
function start(m){
  clearTimeout(timer);S.fm=S.mode=m||S.fm;S.h=0;S.sc=[0,0];Object.assign(S,{outs:0,balls:0,strikes:0,hits:0,hr:0});
  loadBest();clearRun();$('types').hidden=S.mode!=='pitch';
  board();P=null;hit=null;sw=null;resetField();$('ov').hidden=true;S.phase='wait';flash('플레이 볼',S.mode==='bat'?'초 공격':'초 수비');
  timer=setTimeout(S.mode==='pitch'?ready:pitch,1100);
}
function act(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  if(S.phase==='idle'||S.phase==='over')return start(S.fm);
  if(S.phase==='aim')return throwPitch();
  if(S.phase!=='pitch'||sw||S.mode==='pitch')return;
  const now=performance.now();sw={t:now};resolve(now+CONTACT-P.arrive);
}

/* ---------- 매 프레임 ---------- */
const lerp=(a,b,t)=>a+(b-a)*C(t,0,1);
function tick(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(S.phase==='pitch'&&!P.done&&now+CONTACT>P.arrive+200)resolve(null);
  /* 투수 팔 */
  let th=-.2;
  if(P){const tt=(now-(P.t0-WIND))/WIND;
    if(tt>=0&&tt<1)th=tt<.45?lerp(-.2,-3.4,tt/.45):lerp(-3.4,-1.9,(tt-.45)/.55);
    else if(tt>=1)th=lerp(-1.9,-.1,(now-P.t0)/250)}
  arm.rotation.x=th;
  /* 타자 스윙 */
  let yaw=-.9;
  if(sw){const dt2=now-sw.t;yaw=dt2<170?-.9+2.4*dt2/170:dt2<500?1.5:1.5-2.4*C((dt2-500)/300,0,1)}
  up.rotation.y=yaw;
  /* 주자 이동 */
  pool.forEach(r=>{
    if(!r.on||now<r.t0)return;
    if(r.b>=r.to){
      if(r.out&&!r.h){r.h=1;setTimeout(()=>{r.on=false;r.g.visible=false},500)}
      else if(r.to>=4){r.on=false;r.g.visible=false}
      return;
    }
    const tg=BP[r.b+1],q=r.g.position,dx=tg.x-q.x,dz=tg.z-q.z,d=Math.hypot(dx,dz),st=r.sp*dt;
    if(d<=st){q.x=tg.x;q.z=tg.z;r.b++}else{q.x+=dx/d*st;q.z+=dz/d*st}
    r.g.rotation.y=Math.atan2(dx,dz);
  });
  /* 수비 AI 이동 */
  if(hit&&now>=hit.t+300){
    const pl=hit.plan,i=Math.min(hit.path.length-1,Math.floor((now-hit.t)*.06));
    F.forEach(f=>{
      let tg=null;
      if(pl){if(f===pl.f)tg=hit.path[pl.i];else if(pl.out&&!pl.air&&f===F[0])tg=B1;else if(pl.dp&&f===F[1])tg=B2P}
      else if(hit.chase===f)tg=hit.path[i];
      if(tg){const q=f.g.position,dx=tg.x-q.x,dz=tg.z-q.z,d=Math.hypot(dx,dz);
        if(d>.05){const st=Math.min(SPDF*dt,d);q.x+=dx/d*st;q.z+=dz/d*st;f.g.rotation.y=Math.atan2(dx,dz)}}
    });
  }
  ret.visible=S.phase==='aim';ret.position.set(aim.x,aim.y,.15);
  /* 공 */
  let vis=false;
  if(P&&now>=P.t0&&!(hit&&now>=hit.t)){const p=(now-P.t0)/P.dur;if(p<1.15){bp(p,ball.position);vis=true;ball.rotation.x-=dt*22}}
  let follow=false;
  if(hit&&now>=hit.t){
    const k=(now-hit.t)/1000,pl=hit.plan,n=hit.path.length,i=Math.min(n-1,Math.floor(k*60));
    let q=hit.path[i];
    if(pl&&k>=pl.i/60){
      const fp=pl.f.g.position,ts=pl.i/60+.35;
      q=V3(fp.x,1.1,fp.z);
      if(!pl.air&&pl.seq&&k>ts){
        let a=pl.cp||(pl.cp=q.clone()),t=ts;
        for(const tg of pl.seq){
          if(k<t)break;
          const du=a.distanceTo(tg)/28;
          if(k<t+du){const u=(k-t)/du;q=a.clone().lerp(tg,u);q.y+=Math.sin(u*Math.PI)*1.5;break}
          q=tg;a=tg;t+=du+.2;
        }
      }
    }
    ball.position.copy(q);ball.rotation.x-=dt*18;vis=!(hit.hr&&i>=n-1);follow=k<n/60+.5;
  }
  ball.visible=vis;shd.visible=vis;
  if(vis){shd.position.set(ball.position.x,.06,ball.position.z);shd.scale.setScalar(1/(1+ball.position.y*.12))}
  /* 카메라 */
  if(follow)lookT.set(ball.position.x*.9,Math.max(1,ball.position.y*.8),Math.min(ball.position.z,-6));else lookT.copy(DEF);
  look.lerp(lookT,1-Math.pow(.02,dt));
  cam.position.set(camPos.x+(follow?look.x*.08:0),camPos.y,camPos.z);cam.lookAt(look);
  ren.render(scene,cam);requestAnimationFrame(tick);
}

stage.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;e.preventDefault();if(S.mode==='pitch'&&S.phase==='aim')aimAt(e);act()});
stage.addEventListener('pointermove',e=>{if(S.mode==='pitch'&&S.phase==='aim')aimAt(e)});
$('types').addEventListener('click',e=>{const b=e.target.closest('button');if(b){setPT(+b.dataset.i);b.blur()}});
const pre=()=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()};
$('go').addEventListener('click',()=>{pre();start('bat');$('go').blur()});
$('go2').addEventListener('click',()=>{pre();start('pitch');$('go2').blur()});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)act()}
  else if(S.mode==='pitch'&&S.phase==='aim'){
    if(e.key>='1'&&e.key<='3')setPT(+e.key-1);
    const m={ArrowLeft:[-.04,0],ArrowRight:[.04,0],ArrowUp:[0,.04],ArrowDown:[0,-.04]}[e.key];
    if(m){e.preventDefault();aim.x=C(aim.x+m[0],-.5,.5);aim.y=C(aim.y+m[1],.3,1.4)}
  }
});
loadBest();board();requestAnimationFrame(tick);
})();
</script>
</body>
